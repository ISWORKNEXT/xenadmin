[package]
name = "xen-core"
version = "0.2.0"
edition = "2024"
license = "BSD-2-Clause"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
roxmltree = "0.21"
tar = "0.4"
sha2 = "0.10"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-native-certs = "0.8"
url = "2"
uuid = { version = "1", features = ["v7"] }
